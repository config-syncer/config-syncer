# Configuration for golangci-lint v2 (golang-dev images ship v2.x).
version: "2"

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - generated.*\.go
      - client
      - vendor

linters:
  default: standard
  enable:
    - goconst
    - unparam
  exclusions:
    rules:
      # gomega is dot-imported by convention throughout the ginkgo e2e suite.
      - path: test/e2e/
        linters:
          - staticcheck
        text: dot imports
    paths:
      - generated.*\.go
      - client
      - vendor

run:
  timeout: 10m
